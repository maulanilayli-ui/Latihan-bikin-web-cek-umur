<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Program Hitung umur</h2>
    <label for="tahun">Masukan Tahun Lahir:</label>
    <input type="number" id="tahun" placeholder="contoh: 200">
    <button onclick="hitungUmur()">Hitung</button>
    <p id="hasil"></p>
    <script>
        function hitungUmur() {
            let tahunLahir = document.getElementById("tahun").value;
            let tahunSekarang = new Date().getFullYear();
            let umur = tahunSekarang - tahunLahir;
            if (tahunLahir === "") {
                alert("Tahun lahir tidak boleh kosong!");
                return;
            }
            if (tahunLahir > tahunSekarang) {
                alert("Tahun lahir tidak boleh lebih dari tahun sekarang!");
                return;
            }
     document.getElementById("hasil").innerHTML = "Umur kamu sekarang adalah=" + umur + "tahun." 
        }
    </script>
</body>
</html>
